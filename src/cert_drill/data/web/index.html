<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>cert-drill</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <h1 id="deck">cert-drill</h1>
  <p id="progress" class="muted"></p>
</header>
<main>
  <p id="error" class="error" role="alert" hidden></p>
  <section id="card" class="card" hidden>
    <p id="domain" class="domain"></p>
    <p id="stem" class="stem"></p>
    <div id="options" class="options"></div>
    <div id="free" hidden>
      <label for="text">Your answer</label>
      <textarea id="text" rows="6" maxlength="4000"></textarea>
      <button id="send" type="button">Check my answer</button>
      <p class="muted">Or grade yourself (0 = no idea, 5 = perfect):</p>
      <div id="selfgrade" class="row"></div>
    </div>
  </section>
  <section id="feedback" class="card" hidden>
    <p id="verdict" class="verdict"></p>
    <p id="detail" class="muted"></p>
    <p id="explanation"></p>
    <ul id="points" class="points"></ul>
    <div id="citations"></div>
    <button id="next" type="button">Next</button>
  </section>
  <section id="done" class="card" hidden>
    <p id="summary" class="verdict"></p>
    <div id="bars"></div>
    <button id="again" type="button">New session</button>
  </section>
</main>
<footer class="muted">Local only (127.0.0.1). Free-text answers here are scored by a keyword-overlap stand-in grader, not a model.</footer>
</body>
</html>
